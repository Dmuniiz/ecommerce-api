services:
  stripe-cli:
    image: stripe/stripe-cli
    container_name: stripe-cli
    command: >
      listen --api-key sk_test_51TPk9QQAjnHlHwUF4eYt6bg04bZXM7Epr03XsaApppllTQ38iPpRiSmpmUrDfdSe9tbC0HpPX6Cof4Df20plZ9da00NLPr9bGy
      --forward-to host.docker.internal:8080/api/v1/payments/webhook/stripe
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:latest
    container_name: redis-container
    command: redis-server --requirepass 123 --appendonly yes
    ports:
      - "6379:6379"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 123
    restart: always
    volumes:
      - redis-data:/data

volumes:
  redis-data:
